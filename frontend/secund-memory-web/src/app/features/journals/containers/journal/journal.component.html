<div class="journal">
  <aside class="journal__sidebar">
    <app-journal-calendar [activeDate]="date()" />
  </aside>

  <section class="journal__main">
    @if (hasError()) {
      <app-empty-state title="Couldn't load this journal entry" description="Check your connection and try again." />
    } @else {
      <header class="journal__header">
        <button type="button" (click)="goToPreviousDay()" [disabled]="isLoading()" aria-label="Previous day">&larr;</button>
        <h1>{{ heading() }}</h1>
        <button type="button" (click)="goToNextDay()" [disabled]="isLoading()" aria-label="Next day">&rarr;</button>
        @if (!isToday()) {
          <button type="button" class="journal__today-button" (click)="goToToday()">Today</button>
        }
      </header>

      @if (pageId(); as id) {
        <app-block-tree [pageId]="id" />
      }
    }
  </section>
</div>
