<form class="register-form" (submit)="$event.preventDefault(); submit()">
  <app-input label="Display name" [value]="displayName()" (valueChange)="displayName.set($event)" />
  <app-input label="Email" type="email" [value]="email()" (valueChange)="email.set($event)" />
  <app-input label="Password" type="password" [value]="password()" (valueChange)="password.set($event)" />

  @if (error()) {
    <p class="register-form__error">{{ error() }}</p>
  }

  <app-button type="submit" [disabled]="isSubmitting()">Create account</app-button>

  <p class="register-form__footer">Already have an account? <a routerLink="/login">Log in</a></p>
</form>
