<a class="search-result" [routerLink]="['/pages', result().pageId]">
  <span class="search-result__kind">{{ result().kind }}</span>
  <span class="search-result__title" [innerHTML]="result().title | highlight: query()"></span>
  <p class="search-result__snippet" [innerHTML]="result().snippet | highlight: query()"></p>
</a>
