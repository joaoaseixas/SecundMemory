<p class="graph-canvas__note">{{ data().nodes.length }} pages, {{ data().edges.length }} links. Drag to move, click a node to open it.</p>
<div class="graph-canvas__stage">
  <canvas
    #canvas
    class="graph-canvas__canvas"
    (pointermove)="onMove($event)"
    (pointerdown)="onDown($event)"
    (pointerup)="onUp()"
    (pointerleave)="onLeave()"
  ></canvas>
</div>
