<section class="dashboard">
  <h1>Secund Memory</h1>

  @if (summary(); as s) {
    <div class="dashboard__tiles">
      <app-stat-tile label="Notes" [value]="s.noteCount" />
      <app-stat-tile label="Profile facts" [value]="s.profileFactCount" />
      <app-stat-tile label="Tags" [value]="s.tagCount" />
    </div>
    <p class="dashboard__updated">Last updated: {{ s.lastUpdatedUtc }}</p>
  } @else if (error()) {
    <p class="dashboard__error">{{ error() }}</p>
  } @else {
    <p>Loading…</p>
  }
</section>
